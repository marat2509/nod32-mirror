<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Сводка зеркала ESET NOD32</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: dark;
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      --bg: #111315;
      --card: #181b1f;
      --surface-strong: #1f2328;
      --border: #30363d;
      --accent: #46c2a3;
      --accent-soft: rgba(70, 194, 163, 0.14);
      --text-primary: #e8edf2;
      --text-muted: #9aa4af;
      --badge-bg: rgba(154, 164, 175, 0.12);
      --badge-text: #d3dae2;
      --success: #40c463;
      --danger: #f85149;
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      padding: 28px 24px 44px;
    }

    main {
      width: min(1280px, 100%);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header.hero {
      display: grid;
      gap: 16px;
    }

    header.hero h1 {
      margin: 0;
      font-weight: 700;
      font-size: 1.55rem;
      letter-spacing: 0;
    }

    .quick-stats {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    .stat-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px 20px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stat-card span.label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .stat-value {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .stat-card strong {
      font-size: 1.55rem;
      font-weight: 700;
    }

    .table-card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .table-card header {
      padding: 24px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .table-card header h2 {
      margin: 0;
      font-size: 1.4rem;
    }

    .table-card header .badge {
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 960px;
    }

    thead {
      position: sticky;
      top: 0;
      background: var(--surface-strong);
      z-index: 2;
    }

    th, td {
      text-align: left;
      padding: 18px 24px;
      font-size: 0.95rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    th {
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    tbody tr {
      transition: background 0.25s ease;
    }

    tbody tr:hover {
      background: rgba(70, 194, 163, 0.07);
    }

    .channel-badge {
      display: inline-flex;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 1px solid currentColor;
    }
    .channel-production { color: #22c55e; background: rgba(34, 197, 94, 0.1); border-color: rgba(34, 197, 94, 0.3); }
    .channel-deferred { color: #f59e0b; background: rgba(245, 158, 11, 0.1); border-color: rgba(245, 158, 11, 0.3); }
    .channel-pre-release { color: #8b5cf6; background: rgba(139, 92, 246, 0.1); border-color: rgba(139, 92, 246, 0.3); }
    .channel-default { color: var(--text-muted); background: rgba(148, 163, 184, 0.1); border-color: rgba(148, 163, 184, 0.3); }


    .platform-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .platform-badge {
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.75rem;
      letter-spacing: 0.04em;
    }

    .size {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .size-pretty { font-weight: 600; }

    .info-chip {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease;
      z-index: 20;
      outline: none;
    }

    .info-chip:hover,
    .info-chip:focus-visible { transform: translateY(-1px); }

    .files {
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 0.9rem;
      flex-wrap: wrap;
    }

    .files a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--accent-soft);
      transition: background 0.25s ease;
    }

    .files a:hover { background: rgba(70, 194, 163, 0.22); }

    .files .empty {
      color: var(--text-muted);
      font-style: italic;
    }

    .timestamp { font-weight: 600; }

    .timestamp small {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      background: rgba(34, 197, 94, 0.12);
      color: var(--success);
      font-weight: 600;
    }

    .live-status {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      display: grid;
      gap: 18px;
    }

    .live-status-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .live-status-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .live-status-title h2 {
      margin: 0;
      font-size: 1.1rem;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-muted);
      box-shadow: 0 0 0 5px rgba(148, 163, 184, 0.12);
    }

    .status-dot.running {
      background: var(--accent);
      box-shadow: 0 0 0 5px rgba(70, 194, 163, 0.12);
    }

    .status-dot.completed {
      background: var(--success);
      box-shadow: 0 0 0 5px rgba(34, 197, 94, 0.12);
    }

    .status-dot.failed {
      background: var(--danger);
      box-shadow: 0 0 0 5px rgba(248, 81, 73, 0.12);
    }

    .poll-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .poll-control select {
      color: var(--text-primary);
      background: var(--surface-strong);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      outline: none;
    }

    .live-status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
    }

    .status-field {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .status-field span {
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.68rem;
    }

    .status-field strong {
      font-size: 0.95rem;
      overflow-wrap: anywhere;
    }

    .status-message {
      color: var(--text-muted);
      line-height: 1.5;
      margin: 0;
    }

    .status-message.error { color: #fca5a5; }

    #tooltip-portal {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      padding: 8px 12px;
      border-radius: 6px;
      background: #0d1117;
      color: var(--text-primary);
      box-shadow: 0 12px 30px -15px rgba(70, 194, 163, 0.45);
      font-size: 0.75rem;
      line-height: 1.2;
      opacity: 0;
      visibility: hidden;
      white-space: nowrap;
      transition: opacity .12s ease;
    }

    @media (max-width: 720px) {
      body { padding: 24px 14px 48px; }

      header.hero {
        gap: 16px;
      }

      header.hero h1 { font-size: 1.35rem; }

      .quick-stats { grid-template-columns: 1fr; }

      .stat-card { padding: 16px; }

      .live-status { padding: 16px; }

      .live-status-head { align-items: flex-start; }

      .table-card { border-radius: var(--radius); }

      .table-card header {
        padding: 20px;
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
      }

      table, thead, tbody, th, td, tr { display: block; }

      thead { display: none; }

      table { min-width: 0; }

      tbody tr {
        background: var(--surface-strong);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px;
        margin: 0 0 18px 0;
      }

      tbody tr:hover {
        background: rgba(70, 194, 163, 0.08);
      }

      td {
        border: none;
        padding: 10px 0;
        display: grid;
        grid-template-columns: 130px 1fr;
        gap: 12px;
        align-items: baseline;
      }

      td::before {
        content: attr(data-label);
        text-transform: uppercase;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        color: var(--text-muted);
      }

      .platform-badges { justify-content: flex-start; }
      .files { flex-wrap: wrap; }
      .files a { width: fit-content; }
    }
  </style>
</head>
<body>
<main>
  <header class="hero">
    <h1 id="title">ESET NOD32 - зеркало обновлений</h1>
  </header>

  <section class="live-status" aria-live="polite">
    <div class="live-status-head">
      <div class="live-status-title">
        <span class="status-dot" id="status-dot"></span>
        <h2>Статус обновления</h2>
      </div>
      <label class="poll-control" for="status-poll-interval">
        Опрос
        <select id="status-poll-interval">
          <option value="1000">1 сек</option>
          <option value="2000">2 сек</option>
          <option value="5000">5 сек</option>
          <option value="10000">10 сек</option>
          <option value="30000">30 сек</option>
          <option value="60000">60 сек</option>
        </select>
      </label>
    </div>
    <div class="live-status-grid">
      <div class="status-field">
        <span>Состояние</span>
        <strong id="status-state">—</strong>
      </div>
      <div class="status-field">
        <span>Фаза</span>
        <strong id="status-phase">—</strong>
      </div>
      <div class="status-field">
        <span>Действие</span>
        <strong id="status-action">—</strong>
      </div>
      <div class="status-field">
        <span>Версия</span>
        <strong id="status-version">—</strong>
      </div>
      <div class="status-field">
        <span>Канал</span>
        <strong id="status-channel">—</strong>
      </div>
      <div class="status-field">
        <span>Время</span>
        <strong id="status-elapsed">—</strong>
      </div>
      <div class="status-field">
        <span>Обновлено</span>
        <strong id="status-updated">—</strong>
      </div>
    </div>
    <p class="status-message" id="status-message">Статус недоступен</p>
  </section>

  <section class="quick-stats" aria-label="Сводка зеркала">
    <article class="stat-card">
      <span class="label">Последнее обновление</span>
      <div class="stat-value">
        <strong id="last-update">—</strong>
      </div>
      <small id="last-update-relative" style="color:var(--text-muted);" data-iso-updated=""></small>
    </article>
    <article class="stat-card">
      <span class="label">Суммарный объём</span>
      <div class="stat-value" id="total-size-wrap">
        <strong id="total-size">—</strong>
      </div>
    </article>
    <article class="stat-card">
      <span class="label">Кол-во веток</span>
      <strong id="versions-count">—</strong>
      <span class="status-pill" id="versions-status">
        <span style="font-size:12px;">●</span> Загружается…
      </span>
    </article>
  </section>

  <section class="table-card">
    <header>
      <h2>Версии и каналы</h2>
      <span class="badge" id="table-badge">—</span>
    </header>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Версия</th>
            <th>Канал</th>
            <th>Платформы</th>
            <th>База</th>
            <th>Файлы</th>
            <th>Обновлено</th>
          </tr>
        </thead>
        <tbody id="versions-body">
          <tr>
            <td colspan="6" style="text-align:center; padding:48px; color:var(--text-muted);">
              Загружаем данные…
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

</main>

<div id="tooltip-portal" hidden></div>

<script>
  const JSON_PATH = './index.json';
  const STATUS_PATH = './status.json';
  const STATUS_POLL_STORAGE_KEY = 'nod32Mirror.statusPollMs';
  const DEFAULT_STATUS_POLL_MS = 2000;
  const MIN_STATUS_POLL_MS = 1000;
  const MAX_STATUS_POLL_MS = 60000;

  const els = {
    title: document.getElementById('title'),
    lastAbs: document.getElementById('last-update'),
    lastRel: document.getElementById('last-update-relative'),
    totalSizeWrap: document.getElementById('total-size-wrap'),
    totalSize: document.getElementById('total-size'),
    versionsCount: document.getElementById('versions-count'),
    versionsStatus: document.getElementById('versions-status'),
    tableBadge: document.getElementById('table-badge'),
    tbody: document.getElementById('versions-body'),
    tooltip: document.getElementById('tooltip-portal'),
    statusDot: document.getElementById('status-dot'),
    statusState: document.getElementById('status-state'),
    statusPhase: document.getElementById('status-phase'),
    statusAction: document.getElementById('status-action'),
    statusVersion: document.getElementById('status-version'),
    statusChannel: document.getElementById('status-channel'),
    statusElapsed: document.getElementById('status-elapsed'),
    statusUpdated: document.getElementById('status-updated'),
    statusMessage: document.getElementById('status-message'),
    statusPollInterval: document.getElementById('status-poll-interval'),
  };

  const nf = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 1, maximumFractionDigits: 2 });
  const dtf = new Intl.DateTimeFormat('ru-RU', { dateStyle: 'short', timeStyle: 'medium' });
  const rtf = new Intl.RelativeTimeFormat('ru-RU', { numeric: 'auto', style: 'short' });

  function formatAbsolute(ts) {
    return ts ? dtf.format(new Date(ts)) : '—';
  }

  function formatRelative(iso) {
    if (!iso) return 'нет данных';
    const now = Date.now();
    const t = new Date(iso).getTime();
    let sec = Math.round((t - now) / 1000);
    const abs = Math.abs(sec);
    if (abs < 60) return rtf.format(sec, 'second');
    let min = Math.round(sec / 60);
    if (Math.abs(min) < 60) return rtf.format(min, 'minute');
    let hr = Math.round(min / 60);
    if (Math.abs(hr) < 24) return rtf.format(hr, 'hour');
    let day = Math.round(hr / 24);
    if (Math.abs(day) < 7) return rtf.format(day, 'day');
    let wk = Math.round(day / 7);
    if (Math.abs(wk) < 5) return rtf.format(wk, 'week');
    let mon = Math.round(day / 30);
    if (Math.abs(mon) < 12) return rtf.format(mon, 'month');
    let yr = Math.round(day / 365);
    return rtf.format(yr, 'year');
  }

  function formatBytesIEC(bytes) {
    const num = Number(bytes);
    if (!Number.isFinite(num) || num === 0) return '0 Б';
    const units = ['Б','КиБ','МиБ','ГиБ','ТиБ','ПиБ','ЭиБ','ЗиБ','ЙиБ'];
    const exp = Math.min(Math.floor(Math.log(Math.abs(num)) / Math.log(1024)), units.length - 1);
    const value = Math.abs(num) / Math.pow(1024, exp);
    return `${nf.format(value)} ${units[exp]}`;
  }

  function formatDuration(seconds) {
    const sec = Number(seconds);
    if (!Number.isFinite(sec) || sec < 0) return '—';
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    if (h > 0) return `${h} ч ${String(m).padStart(2, '0')} мин`;
    if (m > 0) return `${m} мин ${String(s).padStart(2, '0')} сек`;
    return `${s} сек`;
  }

  function sanitizePollMs(value) {
    const n = Number(value);
    if (!Number.isFinite(n)) return DEFAULT_STATUS_POLL_MS;
    return Math.min(Math.max(Math.round(n), MIN_STATUS_POLL_MS), MAX_STATUS_POLL_MS);
  }

  function getStoredPollMs() {
    try {
      return sanitizePollMs(localStorage.getItem(STATUS_POLL_STORAGE_KEY));
    } catch {
      return DEFAULT_STATUS_POLL_MS;
    }
  }

  function savePollMs(value) {
    const pollMs = sanitizePollMs(value);
    try {
      localStorage.setItem(STATUS_POLL_STORAGE_KEY, String(pollMs));
    } catch {
      // localStorage can be unavailable in restrictive browser modes.
    }
    return pollMs;
  }

  function setSelectPollValue(pollMs) {
    const normalized = String(sanitizePollMs(pollMs));
    const hasOption = Array.from(els.statusPollInterval.options).some(o => o.value === normalized);
    els.statusPollInterval.value = hasOption ? normalized : String(DEFAULT_STATUS_POLL_MS);
  }

  function createPlatformBadges(platforms) {
    const list = Array.isArray(platforms) && platforms.length ? platforms : ['n/a'];
    const wrap = document.createElement('div');
    wrap.className = 'platform-badges';
    list.forEach(p => {
      const b = document.createElement('span');
      b.className = 'platform-badge';
      b.textContent = String(p).toUpperCase();
      wrap.appendChild(b);
    });
    return wrap;
  }

  function createChannelBadge(channel) {
    const b = document.createElement('span');
    b.className = `channel-badge channel-${channel.toLowerCase()}`;
    b.textContent = channel;
    // fallback for unknown channels
    if (!b.classList.contains('channel-production') &&
        !b.classList.contains('channel-deferred') &&
        !b.classList.contains('channel-pre-release') &&
        !b.classList.contains('channel-default')) {
        b.classList.add('channel-default');
    }
    return b;
  }

  function createFileLinks(versionKey, channelName, files) {
    const { file, dll } = files || {};
    const div = document.createElement('div');
    div.className = 'files';
    const parts = [];
    if (file) {
      const a = document.createElement('a');
      a.href = file;
      a.target = '_blank';
      a.rel = 'noopener';
      a.title = `update.ver для ${versionKey} (${channelName})`;
      a.textContent = 'Файл';
      parts.push(a);
    }
    if (dll) {
      const a = document.createElement('a');
      a.href = dll;
      a.target = '_blank';
      a.rel = 'noopener';
      a.title = `dll/update.ver для ${versionKey} (${channelName})`;
      a.textContent = 'DLL';
      parts.push(a);
    }
    if (!parts.length) {
      const span = document.createElement('span');
      span.className = 'empty';
      span.textContent = '—';
      parts.push(span);
    }
    parts.forEach(p => div.appendChild(p));
    return div;
  }

  function buildInfoChip(bytesValue) {
    const bytesNum = Number(bytesValue);
    const chip = document.createElement('span');
    chip.className = 'info-chip';
    chip.tabIndex = 0;
    chip.setAttribute('role', 'button');
    const raw = Number.isFinite(bytesNum) ? bytesNum.toLocaleString('ru-RU') : '0';
    chip.setAttribute('aria-label', `${raw} байт`);
    chip.dataset.tooltip = `${raw} байт`;
    chip.textContent = 'i';
    return chip;
  }

  function buildSizeCell(bytesValue) {
    const numericBytes = Number(bytesValue);
    const container = document.createElement('div');
    container.className = 'size';

    const pretty = Number.isFinite(numericBytes)
      ? formatBytesIEC(numericBytes)
      : '—';

    const prettySpan = document.createElement('span');
    prettySpan.className = 'size-pretty';
    prettySpan.textContent = pretty;
    container.appendChild(prettySpan);

    if (Number.isFinite(numericBytes)) {
      container.appendChild(buildInfoChip(numericBytes));
    }
    return container;
  }

  function fillHeader(metadata) {
    const { title, last_update, total_size, versions } = metadata || {};
    els.title.textContent = title ?? 'ESET NOD32 - зеркало обновлений';

    els.lastAbs.textContent = formatAbsolute(last_update);

    els.lastRel.textContent = formatRelative(last_update);
    els.lastRel.setAttribute('data-iso-updated', last_update || '');

    const totalBytes = Number(total_size?.bytes);
    els.totalSize.textContent = Number.isFinite(totalBytes) ? formatBytesIEC(totalBytes) : '—';
    els.totalSizeWrap.querySelectorAll('.info-chip').forEach(chip => chip.remove());
    if (Number.isFinite(totalBytes)) {
      els.totalSizeWrap.appendChild(buildInfoChip(totalBytes));
    }

    const versionsCount = versions ? Object.keys(versions).length : 0;
    els.versionsCount.textContent = versionsCount;
    els.tableBadge.textContent = `${versionsCount} веток`;
    els.versionsStatus.innerHTML = `
      <span style="font-size:12px;">●</span>
      ${versionsCount > 0 ? 'Ветки активны' : 'Нет данных'}
    `;
  }

  function fillTable(versions) {
    const body = els.tbody;
    body.textContent = '';

    const entries = Object.entries(versions || {});
    if (!entries.length) {
      body.insertAdjacentHTML('beforeend',
        `<tr><td colspan="6" style="text-align:center; padding:36px; color:var(--text-muted);">
          Нет включённых веток для отображения.
        </td></tr>`);
      return;
    }

    const frag = document.createDocumentFragment();

    for (const [key, data] of entries) {
      const channels = data.channels || { default: { database_version: data.database?.version, files: data.files } };
      const channelEntries = Object.entries(channels);

      channelEntries.forEach(([channelName, channelData], index) => {
          const tr = document.createElement('tr');

          // Version column (only for first channel row, spans multiple rows if needed)
          if (index === 0) {
              const tdVer = document.createElement('td');
              tdVer.setAttribute('data-label', 'Версия');
              if (channelEntries.length > 1) {
                  tdVer.rowSpan = channelEntries.length;
              }
              tdVer.innerHTML = `
                <div style="display:flex; flex-direction:column; gap:6px;">
                  <strong></strong>
                  <small style="color:var(--text-muted); font-size:0.8rem;"></small>
                </div>
                <div style="margin-top:8px;"></div>
              `;
              tdVer.querySelector('strong').textContent = data?.name || key;
              tdVer.querySelector('small').textContent = String(key).toUpperCase();

              // Add size info to version cell as it applies to the whole version
              const sizeContainer = buildSizeCell(data?.database?.size?.bytes);
              tdVer.querySelector('div:last-child').appendChild(sizeContainer);

              tr.appendChild(tdVer);
          }

          // Channel column
          const tdChannel = document.createElement('td');
          tdChannel.setAttribute('data-label', 'Канал');
          tdChannel.appendChild(createChannelBadge(channelName));
          tr.appendChild(tdChannel);

          // Platforms (taken from main version info, as they are likely same)
          const tdPlat = document.createElement('td');
          tdPlat.setAttribute('data-label', 'Платформы');
          tdPlat.appendChild(createPlatformBadges(data?.platforms));
          tr.appendChild(tdPlat);

          // Database Version
          const tdDb = document.createElement('td');
          tdDb.setAttribute('data-label', 'База');
          tdDb.innerHTML = `
            <div style="display:flex; flex-direction:column; gap:4px;">
              <span style="font-weight:600; font-size:1rem;"></span>
              <small style="color:var(--text-muted); font-size:0.8rem;">Version ID</small>
            </div>
          `;
          tdDb.querySelector('span').textContent = channelData?.database_version ?? '—';
          tr.appendChild(tdDb);

          // Files
          const tdFiles = document.createElement('td');
          tdFiles.setAttribute('data-label', 'Файлы');
          tdFiles.appendChild(createFileLinks(key, channelName, channelData?.files));
          tr.appendChild(tdFiles);

          // Updated Time (using main version update time as fallback)
          const tdTime = document.createElement('td');
          tdTime.className = 'timestamp';
          tdTime.setAttribute('data-label', 'Обновлено');

          const updateTime = data?.database?.last_update;
          const abs = document.createElement('span');
          abs.textContent = formatAbsolute(updateTime);
          const rel = document.createElement('small');
          rel.textContent = formatRelative(updateTime);
          tdTime.appendChild(abs);
          tdTime.appendChild(rel);
          tdTime.setAttribute('data-iso-updated', updateTime || '');
          tr.appendChild(tdTime);

          frag.appendChild(tr);
      });
    }

    body.replaceChildren(frag);
  }

  let relTimer = null;
  function tickRelative(root = document) {
    root.querySelectorAll('[data-iso-updated]').forEach(el => {
      const iso = el.getAttribute('data-iso-updated');
      const small = el.tagName === 'SMALL' ? el : el.querySelector('small');
      if (small) small.textContent = formatRelative(iso);
    });
  }

  function startRelativeTicker(root = document) {
    if (relTimer) clearInterval(relTimer);
    tickRelative(root);
    relTimer = setInterval(() => tickRelative(root), 60000);
  }

  (function initTooltipPortal() {
    const portal = els.tooltip;
    let anchor = null;
    let rafId = 0;

    function reveal() {
      portal.hidden = false;
      portal.style.visibility = 'visible';
      portal.style.opacity = '1';
    }

    function conceal() {
      portal.style.opacity = '0';
      portal.style.visibility = 'hidden';
      portal.hidden = true;
    }

    function placePortal({ withReveal = false } = {}) {
      if (!anchor) return;
      portal.style.left = '0px';
      portal.style.top = '0px';

      cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(() => {
        const r = anchor.getBoundingClientRect();
        const gap = 10;

        portal.hidden = false;
        const prevVis = portal.style.visibility;
        const prevOp = portal.style.opacity;
        portal.style.visibility = 'hidden';
        portal.style.opacity = '0';

        const pw = portal.offsetWidth;
        const ph = portal.offsetHeight;
        const vw = window.innerWidth;
        const vh = window.innerHeight;

        const upBottom = r.top - gap;
        const topIfUp = upBottom - ph;
        const canUp = topIfUp >= 8;

        let top;
        if (canUp) {
          top = topIfUp;
        } else {
          const downTop = r.bottom + gap;
          top = Math.min(downTop, vh - ph - 8);
        }

        const left = Math.min(
          Math.max(r.left + r.width / 2 - pw / 2, 8),
          vw - pw - 8
        );

        portal.style.left = `${left}px`;
        portal.style.top = `${top}px`;

        portal.style.visibility = prevVis || 'hidden';
        portal.style.opacity = prevOp || '0';

        if (withReveal) reveal();
      });
    }

    function showFor(el) {
      anchor = el;
      const text = el.getAttribute('aria-label') || el.dataset.tooltip || '';
      portal.textContent = text;

      portal.hidden = false;
      portal.style.visibility = 'hidden';
      portal.style.opacity = '0';

      placePortal({ withReveal: true });
    }

    function hide() {
      anchor = null;
      conceal();
    }

    document.addEventListener('mouseenter', (e) => {
      const t = e.target;
      if (t && t.classList && t.classList.contains('info-chip')) showFor(t);
    }, true);

    document.addEventListener('focusin', (e) => {
      const t = e.target;
      if (t && t.classList && t.classList.contains('info-chip')) showFor(t);
    });

    document.addEventListener('mouseleave', (e) => {
      const t = e.target;
      if (t && t.classList && t.classList.contains('info-chip')) hide();
    }, true);

    document.addEventListener('focusout', (e) => {
      const t = e.target;
      if (t && t.classList && t.classList.contains('info-chip')) hide();
    });

    window.addEventListener('scroll', () => { if (anchor) placePortal(); }, { passive: true });
    window.addEventListener('resize', () => { if (anchor) placePortal(); });

    const ro = new ResizeObserver(() => { if (anchor) placePortal(); });
    ro.observe(portal);
  })();

  let currentController = null;
  async function loadJSON(url) {
    if (currentController) {
      currentController.abort();
    }
    currentController = new AbortController();
    try {
      const res = await fetch(url, { cache: 'no-store', signal: currentController.signal });
      if (!res.ok) throw new Error(`Не удалось загрузить JSON: ${res.status}`);
      return await res.json();
    } finally {
      currentController = null;
    }
  }

  function enumText(value) {
    if (!value) return '—';
    if (typeof value === 'object') return value.label || value.key || '—';
    return String(value);
  }

  function updateStatusDot(stateKey) {
    els.statusDot.className = 'status-dot';
    if (stateKey) {
      els.statusDot.classList.add(String(stateKey));
    }
  }

  function renderStatusUnavailable(message, isError = false) {
    updateStatusDot('');
    els.statusState.textContent = '—';
    els.statusPhase.textContent = '—';
    els.statusAction.textContent = '—';
    els.statusVersion.textContent = '—';
    els.statusChannel.textContent = '—';
    els.statusElapsed.textContent = '—';
    els.statusUpdated.textContent = '—';
    els.statusMessage.textContent = message;
    els.statusMessage.classList.toggle('error', isError);
  }

  function renderStatus(status) {
    const current = status?.current || {};
    const run = status?.run || {};
    const stateKey = status?.state?.key || '';

    updateStatusDot(stateKey);
    els.statusState.textContent = enumText(status?.state);
    els.statusPhase.textContent = enumText(current.phase);
    els.statusAction.textContent = enumText(current.action);
    els.statusVersion.textContent = current.version_name || current.version || '—';
    els.statusChannel.textContent = current.channel || '—';
    els.statusElapsed.textContent = formatDuration(run.elapsed_seconds);
    els.statusUpdated.textContent = run.updated_at ? formatAbsolute(run.updated_at) : '—';

    const failedMessage = stateKey === 'failed' ? status?.error?.message : null;
    els.statusMessage.textContent = failedMessage || current.message || '—';
    els.statusMessage.classList.toggle('error', Boolean(failedMessage));
  }

  let statusPollTimer = null;
  let statusRequestActive = false;

  async function loadStatus() {
    if (statusRequestActive) return;
    statusRequestActive = true;

    try {
      const res = await fetch(STATUS_PATH, { cache: 'no-store' });
      if (res.status === 404) {
        renderStatusUnavailable('Статус недоступен');
        return;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      renderStatus(await res.json());
    } catch (error) {
      console.error(error);
      renderStatusUnavailable(`Ошибка загрузки статуса: ${error.message}`, true);
    } finally {
      statusRequestActive = false;
    }
  }

  function startStatusPolling(pollMs = getStoredPollMs()) {
    const normalized = sanitizePollMs(pollMs);
    setSelectPollValue(normalized);

    if (statusPollTimer) {
      clearInterval(statusPollTimer);
    }

    loadStatus();
    statusPollTimer = setInterval(loadStatus, normalized);
  }

  els.statusPollInterval.addEventListener('change', () => {
    startStatusPolling(savePollMs(els.statusPollInterval.value));
  });

  startStatusPolling(getStoredPollMs());

  (async function init() {
    try {
      const metadata = await loadJSON(JSON_PATH);
      fillHeader(metadata);
      fillTable(metadata.versions ?? {});
      startRelativeTicker(document);
    } catch (error) {
      if (error?.name === 'AbortError') return;

      console.error(error);
      els.tbody.innerHTML = `
        <tr>
          <td colspan="6" style="text-align:center; padding:48px; color:#f87171;">
            Не удалось загрузить JSON: ${error.message}
          </td>
        </tr>
      `;
      els.versionsStatus.innerHTML = `
        <span style="font-size:12px;">●</span> Ошибка загрузки
      `;
    }
  })();
</script>
